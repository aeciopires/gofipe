# gofipe + full observability stack (metrics, logs and traces).
#
#   make compose-up     # or: docker compose up -d --build
#
#   gofipe ........... http://localhost:8080
#   Grafana .......... http://localhost:3000  (admin / admin) - dashboards in folder "gofipe"
#   Prometheus ....... http://localhost:9090
#   Jaeger UI ........ http://localhost:16686
#   Loki API ......... http://localhost:3100
#   Tempo API ........ http://localhost:3200
#   OTLP (collector) . localhost:4317 (gRPC) / localhost:4318 (HTTP)
#
# Data flow:
#   metrics: Prometheus scrapes gofipe:8080/metrics (with trace exemplars)
#   traces : gofipe -> OTel Collector -> Tempo + Jaeger (Tempo -> span metrics -> Prometheus)
#   logs   : gofipe -> OTel Collector -> Loki (with trace_id / span_id)
#
# Host ports can be changed with environment variables when a port is busy,
# e.g. GRAFANA_PORT=13000 GOFIPE_PORT=18080 make compose-up
#   GOFIPE_PORT, GRAFANA_PORT, PROMETHEUS_PORT, JAEGER_PORT, LOKI_PORT,
#   TEMPO_PORT, OTLP_GRPC_PORT, OTLP_HTTP_PORT
#
# The stack is for local development: no authentication on the backends and
# data is stored only in Docker volumes.

name: gofipe

services:
  gofipe:
    build:
      context: '.'
      args:
        VERSION: "4.1.0"
    image: aeciopires/gofipe:4.1.0
    environment:
      - PORT=8080
      # OpenTelemetry: traces and logs are sent to the collector (OTLP/HTTP).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=gofipe
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=local
      # Optional: token from https://fipe.online to raise rate limits / extend history
      # - FIPE_API_TOKEN=CHANGE_HERE
    ports:
      - "${GOFIPE_PORT:-8080}:8080"
    depends_on:
      - otel-collector
    restart: unless-stopped
    networks:
      - mynet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - jaeger
      - loki
    restart: unless-stopped
    networks:
      - mynet

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # span metrics / service graph from Tempo
      - --enable-feature=exemplar-storage    # trace IDs attached to gofipe latency metrics
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      gofipe:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mynet

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    networks:
      - mynet

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped
    networks:
      - mynet

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "${JAEGER_PORT:-16686}:16686" # Jaeger UI
    restart: unless-stopped
    networks:
      - mynet

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/gofipe-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
      - jaeger
    restart: unless-stopped
    networks:
      - mynet

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  mynet:
    driver: "bridge"
