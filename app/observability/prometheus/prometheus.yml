# Prometheus scrapes gofipe and the observability stack itself.
# It also receives span metrics and service graph metrics from Tempo
# (remote write, enabled with --web.enable-remote-write-receiver).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gofipe
    static_configs:
      - targets: ['gofipe:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: jaeger
    static_configs:
      - targets: ['jaeger:8888']
